              "PHA: 민감피부에도 자극 없는 PHA 워터가 각질은 잠재우고 피부결은 정돈하는 효과. 고밀도 세라마이드 캡슐: 길이가 긴 롱체인 세라마이드와 연결고리를 조여주는 링커 세라마이드로 민감피부의 짧고 부족한 세라마이드를 보완해 보다 촘촘하고 견고한 구조의 캡슐로 장벽 보습.",
              "PHA 워터에 띄워진 고밀도 세라마이드 캡슐. 물에 녹지 않는 세라마이드를 캡슐 형태로 워터에 띄워놓은 하이드로겔 플로팅 포뮬러 기술. 특허 출원 포뮬러 (특허 출원 번호: KR10-2023-0133775). 하이드로겔 서스펜션 고밀도 세라마이드 캡슐 토너. 사용할 때마다 필요한 만큼만 적절하게 토출되어 피부에 효과적으로 세라마이드 장벽 보습을 제공. 즉각적인 수분 공급 & 결케어 이후 첫 단계 장벽 코팅으로 수분x장벽 시너지 효과.",
              "피부장벽의 빈틈을 촘촘하게, 특허 받은 고밀도 세라마이드 캡슐. 피부지질 구성성분(세라마이드/콜레스테롤/지방산) + 피부지질 유사구조(층판형 구조). 1회 도포 후 18시간 장벽에서 잔존하는 세라마이드 (원료적 특성에 한함, ex vivo 테스트 결과). 캡슐 제형일 때 190% 높은 잔존 효과 (캡슐 vs 비캡슐 세정 실험, 원료적 특성에 한함, in vitro 테스트 결과). 핵심 성분: PHA, 고밀도 세라마이드 캡슐. 추천 피부 타입: 건조 피부 또는 민감 피부. 효능: 세안 후 약해진 피부장벽과 건조함 즉시 케어, 캡슐로 더 오래 지속되는 토너의 보습력.",
              "세안 후 첫 단계 민감 건조 피부 급속 수분 충전. 사용 직후 수분량 1.3배 증가 (피부 수분량 인덱스 54.6 → 72.8). 3일/7일 사용 후 얼굴 3대 부위(뺨, 이마, 턱) 기초 수분량 증가. 세정에 의한 장벽 손상 93% 즉시 회복. 외부자극(Tape Stripping)에 의한 장벽 손상 즉시 회복: 사용 직후 60.5% 회복, 사용 7일 후 87.3% 회복. 사용 직후 각질량 82% 즉시 감소, 12시간 후까지도 잠재우는 피부 각질. 사용할수록 매끈해지는 피부결 & 투명해지는 피부: 사용 7일 후 피부결 7.9%, 투명도 6.0% 개선.",
              "사용법: 1. 아침, 저녁 세안 후, 적당량의 내용물을 덜어줍니다. 2. 캡슐을 부드럽게 녹이듯 골고루 펴 바른 후 가볍게 두드려 흡수시켜줍니다.",
              "철저히 검증한 피부 안전성 테스트: 극민감 테스트 완료, 민감 피부 자극 테스트 완료, 피부과 테스트 완료, 알러지 테스트 완료, 여드름성 피부 사용 적합 테스트 완료(논코메도제닉), 독일 더마 테스트 EXCELLENT 등급."
            ],
